<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#3d2e22"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="200" cy="180" rx="170" ry="110" fill="url(#catBody)"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="85" fill="url(#catBody)"/>
  <!-- Ears with tufts -->
  <polygon points="130,70 165,45 200,70" fill="url(#catBody)"/>
  <polygon points="270,70 235,45 200,70" fill="url(#catBody)"/>
  <!-- Tufts -->
  <circle cx="150" cy="40" r="8" fill="#fff" opacity="0.8"/>
  <circle cx="250" cy="40" r="8" fill="#fff" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="175" cy="125" r="22" fill="url(#catEyes)"/>
  <circle cx="225" cy="125" r="22" fill="url(#catEyes)"/>
  <!-- Nose -->
  <circle cx="200" cy="165" r="8" fill="#fff"/>
  <!-- Muzzle -->
  <ellipse cx="200" cy="155" rx="30" ry="15" fill="#fff" opacity="0.8"/>
  <!-- Nose spot -->
  <circle cx="200" cy="175" r="5" fill="#3d2e22"/>
  <!-- Whiskers -->
  <line x1="170" y1="155" x2="120" y2="155" stroke="#fff" stroke-width="1.5"/>
  <line x1="230" y1="155" x2="280" y2="155" stroke="#fff" stroke-width="1.5"/>
  <line x1="200" y1="155" x2="310" y2="155" stroke="#fff" stroke-width="1.5"/>
  <line x1="170" y1="175" x2="120" y2="175" stroke="#fff" stroke-width="1.5"/>
  <line x1="230" y1="175" x2="280" y2="175" stroke="#fff" stroke-width="1.5"/>
  <line x1="170" y1="195" x2="120" y2="195" stroke="#fff" stroke-width="1.5"/>
  <line x1="230" y1="195" x2="280" y2="195" stroke="#fff" stroke-width="1.5"/>
</svg>