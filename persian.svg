<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8d5c7"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <!-- Cat body -->
  <ellipse cx="200" cy="180" rx="180" ry="120" fill="url(#catBody)"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="90" fill="url(#catBody)"/>
  <!-- Ears -->
  <polygon points="150,80 180,50 200,80" fill="url(#catBody)"/>
  <polygon points="250,80 220,50 200,80" fill="url(#catBody)"/>
  <!-- Eyes -->
  <circle cx="170" cy="130" r="20" fill="url(#catEyes)"/>
  <circle cx="230" cy="130" r="20" fill="url(#catEyes)"/>
  <!-- Nose -->
  <circle cx="200" cy="170" r="10" fill="#e8c4bc"/>
  <!-- Whiskers -->
  <line x1="170" y1="160" x2="130" y2="160" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="230" y1="160" x2="270" y2="160" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="200" y1="160" x2="300" y2="160" stroke="#1a1a2e" stroke-width="2"/>
</svg>