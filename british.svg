<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2d2d30"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Stocky body -->
  <ellipse cx="200" cy="180" rx="150" ry="95" fill="url(#catBody)"/>
  <!-- Head - round -->
  <circle cx="200" cy="130" r="85" fill="url(#catBody)"/>
  <!-- Small round ears -->
  <circle cx="160" cy="80" r="15" fill="url(#catBody)"/>
  <circle cx="240" cy="80" r="15" fill="url(#catBody)"/>
  <!-- Eyes -->
  <circle cx="175" cy="125" r="20" fill="url(#catEyes)"/>
  <circle cx="225" cy="125" r="20" fill="url(#catEyes)"/>
  <!-- Nose - wide -->
  <circle cx="200" cy="165" r="12" fill="#fff"/>
  <circle cx="200" cy="172" r="4" fill="#3a3a3c"/>
  <!-- Whiskers - long and thick -->
  <line x1="175" y1="155" x2="100" y2="155" stroke="#fff" stroke-width="2"/>
  <line x1="225" y1="155" x2="300" y2="155" stroke="#fff" stroke-width="2"/>
  <line x1="200" y1="155" x2="340" y2="155" stroke="#fff" stroke-width="2"/>
  <line x1="175" y1="175" x2="100" y2="175" stroke="#fff" stroke-width="2"/>
  <line x1="225" y1="175" x2="300" y2="175" stroke="#fff" stroke-width="2"/>
  <line x1="175" y1="195" x2="100" y2="195" stroke="#fff" stroke-width="2"/>
  <line x1="225" y1="195" x2="300" y2="195" stroke="#fff" stroke-width="2"/>
</svg>