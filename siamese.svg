<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Slender body -->
  <ellipse cx="200" cy="180" rx="140" ry="90" fill="url(#catBody)"/>
  <!-- Head - long and wedge-shaped -->
  <polygon points="200,80 320,130 320,180 200,180 200,180 80,130" fill="url(#catBody)"/>
  <!-- Large ears -->
  <polygon points="150,50 180,20 210,50" fill="url(#catBody)"/>
  <polygon points="250,50 220,20 190,50" fill="url(#catBody)"/>
  <!-- Eyes - almond-shaped -->
  <polygon points="170,110 190,100 200,120 180,120 170,110" fill="url(#catEyes)"/>
  <polygon points="210,110 230,100 220,120 200,120 210,110" fill="url(#catEyes)"/>
  <!-- Nose small -->
  <triangle points="200,160 185,175 215,175" fill="#1a1a2e"/>
  <!-- Whiskers - long -->
  <line x1="170" y1="145" x2="100" y2="145" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="145" x2="310" y2="145" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="200" y1="145" x2="350" y2="145" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="170" y1="165" x2="100" y2="165" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="165" x2="310" y2="165" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="170" y1="185" x2="100" y2="185" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="185" x2="310" y2="185" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>