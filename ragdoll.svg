<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d5c7"/>
      <stop offset="100%" stop-color="#d5c1b6"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="200" cy="180" rx="165" ry="105" fill="url(#catBody)"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="80" fill="url(#catBody)"/>
  <!-- Ears -->
  <polygon points="150,75 175,50 200,75" fill="url(#catBody)"/>
  <polygon points="250,75 225,50 200,75" fill="url(#catBody)"/>
  <!-- Eyes - blue eye effect -->
  <circle cx="170" cy="120" r="18" fill="url(#catEyes)"/>
  <circle cx="230" cy="120" r="18" fill="url(#catEyes)"/>
  <!-- Eye highlights -->
  <circle cx="172" cy="122" r="5" fill="#fff"/>
  <circle cx="232" cy="122" r="5" fill="#fff"/>
  <!-- Nose -->
  <triangle points="200,165 180,180 220,180" fill="#e8c4bc"/>
  <!-- Mouth area -->
  <curve x1="180" y1="170" x2="220" y2="170" t1="1" t2="0" fill="none" stroke="#e8c4bc" stroke-width="1"/>
  <!-- Whiskers -->
  <line x1="170" y1="150" x2="110" y2="150" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="150" x2="250" y2="150" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="200" y1="150" x2="260" y2="150" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="170" y1="170" x2="110" y2="170" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="170" x2="250" y2="170" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="200" y1="170" x2="260" y2="170" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>