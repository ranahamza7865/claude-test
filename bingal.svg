<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="50%" stop-color="#f6e05e"/>
      <stop offset="100%" stop-color="#e4d565"/>
    </linearGradient>
    <linearGradient id="catEyes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <!-- Body with spots -->
  <ellipse cx="200" cy="180" rx="170" ry="110" fill="url(#catBody)"/>
  <!-- Spots -->
  <circle cx="120" cy="140" r="15" fill="#1a1a2e"/>
  <circle cx="280" cy="120" r="12" fill="#1a1a2e"/>
  <circle cx="150" cy="200" r="14" fill="#1a1a2e"/>
  <circle cx="260" cy="220" r="16" fill="#1a1a2e"/>
  <circle cx="80" cy="250" r="11" fill="#1a1a2e"/>
  <circle cx="320" cy="250" r="13" fill="#1a1a2e"/>
  <!-- Head -->
  <circle cx="200" cy="130" r="85" fill="url(#catBody)"/>
  <!-- Ears -->
  <polygon points="150,70 180,45 210,70" fill="url(#catBody)"/>
  <polygon points="250,70 220,45 190,70" fill="url(#catBody)"/>
  <!-- Eyes -->
  <circle cx="175" cy="125" r="20" fill="url(#catEyes)"/>
  <circle cx="225" cy="125" r="20" fill="url(#catEyes)"/>
  <!-- Nose -->
  <triangle points="200,170 185,185 215,185" fill="#1a1a2e"/>
  <!-- Whiskers -->
  <line x1="175" y1="155" x2="120" y2="155" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="225" y1="155" x2="280" y2="155" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="200" y1="155" x2="310" y2="155" stroke="#1a1a2e" stroke-width="2"/>
</svg>